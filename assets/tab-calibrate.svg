  </g>
  <g class="f3">
    <text x="496" y="186" class="mono t-ok" font-size="10" font-weight="700">37.8ms · 2 / 3 passed (gate &gt;= 3.8 — low-relevance #8 filtered)</text>
    <rect class="sub-warn" x="494" y="196" width="476" height="54" rx="6" />
