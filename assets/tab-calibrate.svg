  <text x="582.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Engines</text>
  <rect class="pill-act" x="624" y="12" width="122" height="24" rx="5" />
  <text x="685.0" y="28" text-anchor="middle" class="sans t-acc" font-size="10.5" font-weight="700">Calibration &amp; Test</text>

  <!-- Step Indicator -->
  <rect class="b-mut" x="844" y="12" width="140" height="24" rx="5" />
  <text x="914" y="27.5" text-anchor="middle" class="mono t-sec" font-size="9.8" font-weight="600">Auto-Play · 4s/step</text>
  <rect class="sub" x="16" y="58" width="314" height="28" rx="6" />
  <g class="f1"><rect class="sub-hi" x="16" y="58" width="314" height="28" rx="6" /></g>
  <text x="173" y="76" text-anchor="middle" class="sans t-pri" font-size="10.8" font-weight="600">Step 1: Confidence Distribution</text>
