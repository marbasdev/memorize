  <text x="312" y="380" text-anchor="middle" class="mono t-mut" font-size="9.5">0.85+</text>
  <rect class="b-info" x="368" y="288" width="48" height="76" rx="4" />
  <text x="392" y="380" text-anchor="middle" class="mono t-mut" font-size="9.5">0.95+</text>

  <!-- Right: Live Probe -->
  <rect class="card" x="480" y="96" width="504" height="308" rx="8" />
  <text x="494" y="120" class="sans t-pri" font-size="11.5" font-weight="700">Live Rule Query Testbench</text>
