    <text x="412" y="182" text-anchor="middle" class="mono t-acc" font-size="13" font-weight="700">3.2</text>
  </g>
  <g class="f2">
    <rect x="44" y="174" width="180" height="8" rx="4" fill="#2dd4bf" />
