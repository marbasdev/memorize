<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="100%" height="100%" role="img" aria-label="웹 콘솔 팀 규칙 탭 시뮬레이션">
  <style>
    .outer { fill: #090b0e; stroke: #222934; stroke-width: 1.5; }
