<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="100%" height="100%" role="img" aria-label="웹 콘솔 가드레일 탭 동작 시뮬레이션">
  <style>
    .outer { fill: #0b0e13; stroke: #243041; stroke-width: 1.5; }
    .topbar { fill: #121720; stroke: #243041; stroke-width: 1; }
    .card { fill: #121720; stroke: #243041; stroke-width: 1; }
    .sub { fill: #161d28; stroke: #263346; stroke-width: 1; }
    .sub-hi { fill: rgba(56, 189, 248, 0.10); stroke: rgba(56, 189, 248, 0.45); stroke-width: 1.2; }
    .sub-ok { fill: rgba(16, 185, 129, 0.10); stroke: rgba(16, 185, 129, 0.45); stroke-width: 1.2; }
    .sub-warn { fill: rgba(245, 158, 11, 0.10); stroke: rgba(245, 158, 11, 0.45); stroke-width: 1.2; }
    .sub-err { fill: rgba(239, 68, 68, 0.10); stroke: rgba(239, 68, 68, 0.48); stroke-width: 1.2; }
    .pill-idle { fill: #18202c; stroke: #263346; stroke-width: 1; }
    .pill-act { fill: rgba(56, 189, 248, 0.16); stroke: rgba(56, 189, 248, 0.55); stroke-width: 1.2; }
    .b-ok { fill: rgba(16, 185, 129, 0.16); stroke: rgba(16, 185, 129, 0.45); stroke-width: 1; }
    .b-err { fill: rgba(239, 68, 68, 0.16); stroke: rgba(239, 68, 68, 0.45); stroke-width: 1; }
    .b-warn { fill: rgba(245, 158, 11, 0.16); stroke: rgba(245, 158, 11, 0.45); stroke-width: 1; }
    .b-info { fill: rgba(56, 189, 248, 0.16); stroke: rgba(56, 189, 248, 0.45); stroke-width: 1; }
    .b-mut { fill: rgba(100, 116, 139, 0.18); stroke: rgba(100, 116, 139, 0.4); stroke-width: 1; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t-pri { fill: #f1f5f9; }
    .t-sec { fill: #94a3b8; }
    .t-mut { fill: #64748b; }
    .t-acc { fill: #38bdf8; }
    .t-ok { fill: #34d399; }
    .t-warn { fill: #fbbf24; }
    .t-err { fill: #f87171; }
    .btn-pri { fill: #0284c7; stroke: #38bdf8; stroke-width: 1; }

    /* 12s loop across 3 frames (4s per frame) */
    .f1, .f2, .f3 { opacity: 0; }
    .f1 { animation: loop1 12s infinite; }
    .f2 { animation: loop2 12s infinite; }
    .f3 { animation: loop3 12s infinite; }
    @keyframes loop1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes loop2 { 0%, 32% { opacity: 0; } 34%, 65% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes loop3 { 0%, 66% { opacity: 0; } 68%, 98% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <rect class="outer" x="1" y="1" width="998" height="426" rx="12" />
  <rect class="topbar" x="1" y="1" width="998" height="46" rx="12" />
  <rect x="1" y="34" width="998" height="13" fill="#121720" />
  <line x1="1" y1="47" x2="999" y2="47" stroke="#243041" stroke-width="1" />

  <!-- Brand + Port -->
  <rect class="b-info" x="16" y="12" width="136" height="24" rx="5" />
  <text x="84" y="28" text-anchor="middle" class="mono t-acc" font-size="11" font-weight="700">memorize :18095</text>

  <!-- 5 Console Tabs -->
  <rect class="pill-idle" x="166" y="12" width="104" height="24" rx="5" />
  <text x="218.0" y="28" text-anchor="middle" class="sans t-sec" font-size="11" font-weight="600">기억 관리</text>
  <rect class="pill-idle" x="278" y="12" width="96" height="24" rx="5" />
  <text x="326.0" y="28" text-anchor="middle" class="sans t-sec" font-size="11" font-weight="600">진행 현황</text>
  <rect class="pill-act" x="382" y="12" width="102" height="24" rx="5" />
  <text x="433.0" y="28" text-anchor="middle" class="sans t-acc" font-size="11" font-weight="700">가드레일</text>
  <rect class="pill-idle" x="492" y="12" width="92" height="24" rx="5" />
  <text x="538.0" y="28" text-anchor="middle" class="sans t-sec" font-size="11" font-weight="600">추론 엔진</text>
  <rect class="pill-idle" x="592" y="12" width="134" height="24" rx="5" />
  <text x="659.0" y="28" text-anchor="middle" class="sans t-sec" font-size="11" font-weight="600">임계값 · 테스트</text>

  <!-- Topbar right indicator -->
  <rect class="b-mut" x="836" y="12" width="148" height="24" rx="5" />
  <text x="910" y="28" text-anchor="middle" class="mono t-sec" font-size="10.2" font-weight="600">자동 재생 · 4초/단계</text>

  <rect class="sub" x="16" y="58" width="314" height="28" rx="6" />
  <g class="f1">
    <rect class="sub-hi" x="16" y="58" width="314" height="28" rx="6" />
  </g>
  <text x="173" y="76" text-anchor="middle" class="sans t-pri" font-size="11" font-weight="600">1단계: 작업·명령 계획 입력</text>
  <rect class="sub" x="343" y="58" width="314" height="28" rx="6" />
  <g class="f2">
    <rect class="sub-hi" x="343" y="58" width="314" height="28" rx="6" />
  </g>
  <text x="500" y="76" text-anchor="middle" class="sans t-pri" font-size="11" font-weight="600">2단계: 실시간 BLOCK 차단 &amp; 로그</text>
  <rect class="sub" x="670" y="58" width="314" height="28" rx="6" />
  <g class="f3">
    <rect class="sub-hi" x="670" y="58" width="314" height="28" rx="6" />
  </g>
  <text x="827" y="76" text-anchor="middle" class="sans t-pri" font-size="11" font-weight="600">3단계: 정상 PASS &amp; 통과 이력 정리</text>

  <!-- Top Card: Plan Simulator -->
  <rect class="card" x="16" y="96" width="968" height="148" rx="8" />
  <text x="30" y="120" class="sans t-pri" font-size="11.5" font-weight="700">실행 전 작업 계획 위반 사전 검사</text>
  <rect class="b-info" x="30" y="130" width="130" height="26" rx="5" />
  <text x="95" y="147" text-anchor="middle" class="mono t-acc" font-size="10.2" font-weight="700">project:memorize</text>

  <rect class="sub" x="168" y="130" width="676" height="26" rx="5" />
  <text x="180" y="147" class="mono t-pri f1" font-size="10.8">CGO_ENABLED=1 go build ./cmd/memorize 실행</text>
  <text x="180" y="147" class="mono t-err f2" font-size="10.8">CGO_ENABLED=1 go build ./cmd/memorize 실행</text>
  <text x="180" y="147" class="mono t-ok f3" font-size="10.8">CGO_ENABLED=0 go build -trimpath ./cmd/memorize 실행</text>

  <rect class="btn-pri" x="852" y="130" width="118" height="26" rx="5" />
  <text x="911" y="147" text-anchor="middle" class="sans t-pri" font-size="10.5" font-weight="700">위반 여부 검사</text>

  <g class="f1">
    <rect class="sub" x="30" y="166" width="940" height="64" rx="6" />
    <text x="44" y="202" class="sans t-sec" font-size="11">실행할 명령이나 코드 변경 계획을 입력하면 활성 규칙 위반 여부를 검증합니다.</text>
  </g>
  <g class="f2">
    <rect class="sub-err" x="30" y="166" width="940" height="64" rx="6" />
    <rect class="b-err" x="44" y="180" width="68" height="20" rx="4" />
    <text x="78" y="194" text-anchor="middle" class="mono t-err" font-size="10" font-weight="700">BLOCK</text>
    <text x="124" y="194" class="sans t-err" font-size="11.5" font-weight="700">BLOCKED (확률: 96%) — [#1 고정 원칙] Go 빌드 시 CGO 사용 금지 위반</text>
  </g>
  <g class="f3">
    <rect class="sub-ok" x="30" y="166" width="940" height="64" rx="6" />
    <rect class="b-ok" x="44" y="180" width="68" height="20" rx="4" />
    <text x="78" y="194" text-anchor="middle" class="mono t-ok" font-size="10" font-weight="700">PASS</text>
    <text x="124" y="194" class="sans t-ok" font-size="11.5" font-weight="700">PASS (활성 규칙 14건 대조 결과 위반 없음)</text>
  </g>

  <!-- Bottom Card: Audit Logs -->
  <rect class="card" x="16" y="254" width="968" height="158" rx="8" />
  <text x="30" y="278" class="sans t-pri" font-size="11.5" font-weight="700">가드레일 감사 로그</text>
  <rect class="pill-idle f1" x="844" y="262" width="126" height="22" rx="4" />
  <rect class="pill-idle f2" x="844" y="262" width="126" height="22" rx="4" />
  <rect class="pill-act f3" x="844" y="262" width="126" height="22" rx="4" />
  <text x="907" y="277" text-anchor="middle" class="sans t-pri" font-size="10" font-weight="600">PASS 로그 정리</text>

  <g class="f1">
    <rect class="sub-err" x="30" y="294" width="940" height="44" rx="6" />
    <text x="44" y="320" class="mono t-err" font-size="11" font-weight="700">BLOCKED · git pre-commit · #1 CGO 금지 위반</text>
    <rect class="sub" x="30" y="346" width="940" height="44" rx="6" />
    <text x="44" y="372" class="mono t-ok" font-size="11">PASS · PreToolUse · Edit(README.md)</text>
  </g>
  <g class="f2">
    <rect class="sub-err" x="30" y="294" width="940" height="44" rx="6" />
    <rect class="b-err" x="44" y="307" width="46" height="18" rx="4" />
    <text x="67" y="320" text-anchor="middle" class="mono t-err" font-size="9.5" font-weight="700">NEW</text>
    <text x="100" y="320" class="mono t-err" font-size="11" font-weight="700">BLOCKED · 계획 검사 · #1 CGO 사용 금지 위반 (96%)</text>
    <rect class="sub" x="30" y="346" width="940" height="44" rx="6" />
    <text x="44" y="372" class="mono t-sec" font-size="11">BLOCKED · git pre-commit · #1 CGO 금지 위반</text>
  </g>
  <g class="f3">
    <rect class="sub-ok" x="30" y="294" width="940" height="44" rx="6" />
    <text x="44" y="320" class="mono t-ok" font-size="11" font-weight="700">PASS · 계획 검사 · CGO_ENABLED=0 준수 확인</text>
    <rect class="sub-err" x="30" y="346" width="940" height="44" rx="6" />
    <text x="44" y="372" class="mono t-err" font-size="11">BLOCKED · 계획 검사 · #1 CGO 사용 금지 위반 (96%)</text>
  </g>
</svg>
