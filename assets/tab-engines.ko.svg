<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 468" width="100%" height="100%" role="img" aria-label="웹 콘솔 추론 엔진 탭 텔레메트리, 설정 및 경고 해제 시뮬레이션">
  <style>
    .outer { fill: #0b0e13; stroke: #243041; stroke-width: 1.5; }
    .topbar { fill: #121720; stroke: #243041; stroke-width: 1; }
    .card { fill: #121720; stroke: #243041; stroke-width: 1; }
    .sub { fill: #161d28; stroke: #263346; stroke-width: 1; }
    .sub-hi { fill: rgba(56, 189, 248, 0.10); stroke: rgba(56, 189, 248, 0.45); stroke-width: 1.2; }
    .sub-ok { fill: rgba(16, 185, 129, 0.10); stroke: rgba(16, 185, 129, 0.45); stroke-width: 1.2; }
    .sub-warn { fill: rgba(245, 158, 11, 0.10); stroke: rgba(245, 158, 11, 0.45); stroke-width: 1.2; }
    .sub-err { fill: rgba(239, 68, 68, 0.10); stroke: rgba(239, 68, 68, 0.48); stroke-width: 1.2; }
    .pill-idle { fill: #18202c; stroke: #263346; stroke-width: 1; }
    .pill-act { fill: rgba(56, 189, 248, 0.16); stroke: rgba(56, 189, 248, 0.55); stroke-width: 1.2; }
    .b-ok { fill: rgba(16, 185, 129, 0.16); stroke: rgba(16, 185, 129, 0.45); stroke-width: 1; }
    .b-err { fill: rgba(239, 68, 68, 0.16); stroke: rgba(239, 68, 68, 0.45); stroke-width: 1; }
    .b-warn { fill: rgba(245, 158, 11, 0.16); stroke: rgba(245, 158, 11, 0.45); stroke-width: 1; }
    .b-info { fill: rgba(56, 189, 248, 0.16); stroke: rgba(56, 189, 248, 0.45); stroke-width: 1; }
    .b-mut { fill: rgba(100, 116, 139, 0.18); stroke: rgba(100, 116, 139, 0.4); stroke-width: 1; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t-pri { fill: #f1f5f9; }
    .t-sec { fill: #94a3b8; }
    .t-mut { fill: #64748b; }
    .t-acc { fill: #38bdf8; }
    .t-ok { fill: #34d399; }
    .t-warn { fill: #fbbf24; }
    .t-err { fill: #f87171; }
    .btn-pri { fill: #0284c7; stroke: #38bdf8; stroke-width: 1; }

    /* 12s loop across 3 frames (4s per frame) */
    .f1, .f2, .f3 { opacity: 0; }
    .f1 { animation: loop1 12s infinite; }
    .f2 { animation: loop2 12s infinite; }
    .f3 { animation: loop3 12s infinite; }
    @keyframes loop1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes loop2 { 0%, 32% { opacity: 0; } 34%, 65% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes loop3 { 0%, 66% { opacity: 0; } 68%, 98% { opacity: 1; } 100% { opacity: 0; } }
