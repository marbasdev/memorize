<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 428" width="100%" height="100%" role="img" aria-label="웹 콘솔 기억 관리 탭 동작 시뮬레이션">
  <style>
    .outer { fill: #0b0e13; stroke: #243041; stroke-width: 1.5; }
