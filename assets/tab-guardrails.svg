<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="100%" height="100%" role="img" aria-label="Web Console Guardrails Tab Simulation">
  <style>
    .outer { fill: #090b0e; stroke: #222934; stroke-width: 1.5; }
    .topbar { fill: #101318; stroke: #222934; stroke-width: 1; }
    .card { fill: #101318; stroke: #222934; stroke-width: 1; }
    .sub { fill: #141820; stroke: #252d3a; stroke-width: 1; }
    .sub-hi { fill: rgba(45, 212, 191, 0.10); stroke: rgba(45, 212, 191, 0.42); stroke-width: 1.2; }
    .sub-ok { fill: rgba(52, 211, 153, 0.10); stroke: rgba(52, 211, 153, 0.42); stroke-width: 1.2; }
    .sub-warn { fill: rgba(251, 191, 36, 0.10); stroke: rgba(251, 191, 36, 0.42); stroke-width: 1.2; }
    .sub-err { fill: rgba(248, 113, 113, 0.10); stroke: rgba(248, 113, 113, 0.45); stroke-width: 1.2; }
    .nav-shell { fill: #101318; stroke: #222934; stroke-width: 1; }
    .pill-idle { fill: #161b22; stroke: #252d3a; stroke-width: 1; }
    .pill-act { fill: rgba(45, 212, 191, 0.14); stroke: rgba(45, 212, 191, 0.48); stroke-width: 1.2; }
    .b-ok { fill: rgba(52, 211, 153, 0.14); stroke: rgba(52, 211, 153, 0.42); stroke-width: 1; }
    .b-err { fill: rgba(248, 113, 113, 0.14); stroke: rgba(248, 113, 113, 0.42); stroke-width: 1; }
    .b-warn { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.42); stroke-width: 1; }
    .b-info { fill: rgba(45, 212, 191, 0.13); stroke: rgba(45, 212, 191, 0.38); stroke-width: 1; }
    .b-mut { fill: #161b22; stroke: #283140; stroke-width: 1; }
    .sans { font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .t-pri { fill: #eef2f6; }
    .t-sec { fill: #8b95a5; }
    .t-mut { fill: #606b7b; }
    .t-acc { fill: #2dd4bf; }
    .t-ok { fill: #34d399; }
    .t-warn { fill: #fbbf24; }
    .t-err { fill: #f87171; }
    .btn-pri { fill: #0f766e; stroke: #2dd4bf; stroke-width: 1; }
    .f1, .f2, .f3 { opacity: 0; }
    .f1 { animation: loop1 12s infinite; }
    .f2 { animation: loop2 12s infinite; }
    .f3 { animation: loop3 12s infinite; }
    @keyframes loop1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes loop2 { 0%, 32% { opacity: 0; } 34%, 65% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes loop3 { 0%, 66% { opacity: 0; } 68%, 98% { opacity: 1; } 100% { opacity: 0; } }
</style>
  <rect class="outer" x="1" y="1" width="998" height="410" rx="12" />
  <rect class="topbar" x="1" y="1" width="998" height="46" rx="12" />
  <rect x="1" y="34" width="998" height="13" fill="#101318" />
  <line x1="1" y1="47" x2="999" y2="47" stroke="#222934" stroke-width="1" />

  <!-- Geometric Brand Mark + Live Daemon Badge -->
  <rect class="b-info" x="16" y="12" width="24" height="24" rx="6" />
  <path d="M22.5 18.5h6a2.8 2.8 0 0 1 0 5.6h-3.2v3.4" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="31.2" cy="27.2" r="1.4" fill="#2dd4bf" />
  <text x="48" y="28.5" class="mono t-pri" font-size="13" font-weight="700">praxis</text>
  <rect class="b-mut" x="104" y="13" width="84" height="22" rx="5" />
  <circle cx="116" cy="24" r="3" fill="#34d399" />
  <text x="151" y="27.5" text-anchor="middle" class="mono t-sec" font-size="10" font-weight="600">:18095</text>

  <!-- 6 Console Tabs -->
  <rect class="pill-idle" x="204" y="12" width="78" height="24" rx="5" />
  <text x="243.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Memories</text>
  <rect class="pill-idle" x="288" y="12" width="86" height="24" rx="5" />
  <text x="331.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Team Rules</text>
  <rect class="pill-idle" x="380" y="12" width="76" height="24" rx="5" />
  <text x="418.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Progress</text>
  <rect class="pill-act" x="462" y="12" width="82" height="24" rx="5" />
  <text x="503.0" y="28" text-anchor="middle" class="sans t-acc" font-size="10.5" font-weight="700">Guardrails</text>
  <rect class="pill-idle" x="550" y="12" width="72" height="24" rx="5" />
  <text x="586.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Engines</text>
  <rect class="pill-idle" x="628" y="12" width="122" height="24" rx="5" />
  <text x="689.0" y="28" text-anchor="middle" class="sans t-sec" font-size="10.5" font-weight="600">Calibration &amp; Test</text>

  <!-- Step Indicator -->
  <rect class="b-mut" x="844" y="12" width="140" height="24" rx="5" />
  <text x="914" y="27.5" text-anchor="middle" class="mono t-sec" font-size="9.8" font-weight="600">Auto-Play · 4s/step</text>
  <rect class="sub" x="16" y="58" width="314" height="28" rx="6" />
  <g class="f1"><rect class="sub-hi" x="16" y="58" width="314" height="28" rx="6" /></g>
  <text x="173" y="76" text-anchor="middle" class="sans t-pri" font-size="10.8" font-weight="600">Step 1: Enter Shell / Edit Plan</text>
  <rect class="sub" x="343" y="58" width="314" height="28" rx="6" />
  <g class="f2"><rect class="sub-hi" x="343" y="58" width="314" height="28" rx="6" /></g>
  <text x="500" y="76" text-anchor="middle" class="sans t-pri" font-size="10.8" font-weight="600">Step 2: Real-Time Rule Block (96%)</text>
  <rect class="sub" x="670" y="58" width="314" height="28" rx="6" />
  <g class="f3"><rect class="sub-hi" x="670" y="58" width="314" height="28" rx="6" /></g>
  <text x="827" y="76" text-anchor="middle" class="sans t-pri" font-size="10.8" font-weight="600">Step 3: Verified PASS &amp; Audit Cleanup</text>

  <!-- Top Card: Plan Verifier -->
  <rect class="card" x="16" y="96" width="968" height="142" rx="8" />
  <text x="30" y="120" class="sans t-pri" font-size="11.5" font-weight="700">Pre-Execution Plan &amp; Command Verifier</text>
  <rect class="b-info" x="30" y="130" width="124" height="26" rx="5" />
  <text x="92" y="147" text-anchor="middle" class="mono t-acc" font-size="10" font-weight="700">project:praxis</text>

  <rect class="sub" x="162" y="130" width="682" height="26" rx="5" />
  <text x="174" y="147" class="mono t-pri f1" font-size="10.5">CGO_ENABLED=1 go build ./cmd/praxis</text>
  <text x="174" y="147" class="mono t-err f2" font-size="10.5">CGO_ENABLED=1 go build ./cmd/praxis</text>
  <text x="174" y="147" class="mono t-ok f3" font-size="10.5">CGO_ENABLED=0 go build -trimpath -o bin/praxis ./cmd/praxis</text>

  <rect class="btn-pri" x="852" y="130" width="118" height="26" rx="5" />
  <text x="911" y="147" text-anchor="middle" class="sans t-pri" font-size="10.2" font-weight="700">Verify Plan</text>

  <g class="f1">
    <rect class="sub" x="30" y="166" width="940" height="58" rx="6" />
    <text x="44" y="199" class="sans t-sec" font-size="10.8">Enter a shell command or edit plan to verify compliance against active local &amp; team rules.</text>
  </g>
  <g class="f2">
    <rect class="sub-err" x="30" y="166" width="940" height="58" rx="6" />
    <rect class="b-err" x="44" y="185" width="64" height="20" rx="4" />
    <text x="76" y="198.5" text-anchor="middle" class="mono t-err" font-size="9.8" font-weight="700">BLOCK</text>
    <text x="120" y="199" class="sans t-err" font-size="11" font-weight="700">BLOCKED (96%) — Violates Core Rule #1: Keep pure-Go static builds (CGO_ENABLED=0)</text>
  </g>
  <g class="f3">
    <rect class="sub-ok" x="30" y="166" width="940" height="58" rx="6" />
    <rect class="b-ok" x="44" y="185" width="64" height="20" rx="4" />
    <text x="76" y="198.5" text-anchor="middle" class="mono t-ok" font-size="9.8" font-weight="700">PASS</text>
    <text x="120" y="199" class="sans t-ok" font-size="11" font-weight="700">PASS — Compliant with all active local &amp; team rules</text>
  </g>

  <!-- Bottom Card: Audit Log -->
  <rect class="card" x="16" y="248" width="968" height="148" rx="8" />
  <text x="30" y="272" class="sans t-pri" font-size="11.5" font-weight="700">Guardrail Audit Log (PreToolUse · Stop · git pre-commit)</text>
  <rect class="pill-idle f1" x="844" y="256" width="126" height="22" rx="4" />
  <rect class="pill-idle f2" x="844" y="256" width="126" height="22" rx="4" />
  <rect class="pill-act f3" x="844" y="256" width="126" height="22" rx="4" />
  <text x="907" y="271" text-anchor="middle" class="sans t-pri" font-size="10" font-weight="600">Clean PASS Logs</text>

  <g class="f1">
    <rect class="sub-err" x="30" y="286" width="940" height="44" rx="6" />
    <text x="44" y="312" class="mono t-err" font-size="10.5" font-weight="700">BLOCKED · PreToolUse(Bash) · Core Rule #1 (CGO_ENABLED=0)</text>
    <rect class="sub" x="30" y="338" width="940" height="44" rx="6" />
    <text x="44" y="364" class="mono t-ok" font-size="10.5">PASS · Stop(Turn Diff) · internal/transport/dashboard/ssr_team.go</text>
  </g>
  <g class="f2">
    <rect class="sub-err" x="30" y="286" width="940" height="44" rx="6" />
    <rect class="b-err" x="44" y="299" width="44" height="18" rx="4" />
    <text x="66" y="311.5" text-anchor="middle" class="mono t-err" font-size="9.2" font-weight="700">NEW</text>
    <text x="98" y="312" class="mono t-err" font-size="10.5" font-weight="700">BLOCKED · verify_plan · Core Rule #1 (96%)</text>
    <rect class="sub" x="30" y="338" width="940" height="44" rx="6" />
    <text x="44" y="364" class="mono t-sec" font-size="10.5">BLOCKED · PreToolUse(Bash) · Core Rule #1 (CGO_ENABLED=0)</text>
  </g>
  <g class="f3">
    <rect class="sub-ok" x="30" y="286" width="940" height="44" rx="6" />
    <text x="44" y="312" class="mono t-ok" font-size="10.5" font-weight="700">PASS · verify_plan · CGO_ENABLED=0 static build verified</text>
    <rect class="sub-err" x="30" y="338" width="940" height="44" rx="6" />
    <text x="44" y="364" class="mono t-err" font-size="10.5">BLOCKED · verify_plan · Core Rule #1 (96%)</text>
  </g>
</svg>
