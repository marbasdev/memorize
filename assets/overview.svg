<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" width="100%" height="100%" role="img" aria-label="Without praxis vs With praxis session comparison">
  <defs>
    <style>
      .s-outer { fill: #090b0e; stroke: #222934; stroke-width: 1.5; }
      .s-top { fill: #101318; stroke: #222934; stroke-width: 1; }
      .s-panel { fill: #101318; stroke: #222934; stroke-width: 1; }
      .s-card { fill: #141820; stroke: #262f3d; stroke-width: 1; }
      .s-term { fill: #0b0e13; stroke: #262f3d; stroke-width: 1; }
      .s-err { fill: rgba(248, 113, 113, 0.12); stroke: rgba(248, 113, 113, 0.45); stroke-width: 1; }
      .s-ok { fill: rgba(52, 211, 153, 0.12); stroke: rgba(52, 211, 153, 0.45); stroke-width: 1; }
      .s-info { fill: rgba(45, 212, 191, 0.12); stroke: rgba(45, 212, 191, 0.40); stroke-width: 1; }
      .s-sans { font-family: "Inter", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .s-mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .c-pri { fill: #eef2f6; }
      .c-sec { fill: #8b95a5; }
      .c-mut { fill: #606b7b; }
      .c-acc { fill: #2dd4bf; }
      .c-ok { fill: #34d399; }
      .c-err { fill: #f87171; }
      .c-warn { fill: #fbbf24; }
    </style>
  </defs>

  <rect class="s-outer" x="1" y="1" width="998" height="383" rx="12" />
  <rect class="s-top" x="1" y="1" width="998" height="44" rx="12" />
  <rect x="1" y="32" width="998" height="13" fill="#101318" />
  <line x1="1" y1="45" x2="999" y2="45" stroke="#222934" stroke-width="1" />

  <rect class="s-info" x="18" y="10" width="248" height="24" rx="5" />
  <text x="142" y="26" text-anchor="middle" class="s-sans c-acc" font-size="11.2" font-weight="700">Real Coding Session (Before vs After)</text>
  <text x="982" y="26" text-anchor="end" class="s-sans c-sec" font-size="11">Rule Changed in Chat → /compact Summary → Turn 42 Edit</text>

  <!-- LEFT: WITHOUT PRAXIS -->
  <rect class="s-panel" x="18" y="58" width="466" height="311" rx="8" />
  <text x="34" y="82" class="s-sans c-pri" font-size="12.2" font-weight="700">Without praxis (CLAUDE.md · Memory MCPs)</text>
  <rect class="s-err" x="372" y="66" width="98" height="22" rx="4" />
  <text x="421" y="81" text-anchor="middle" class="s-sans c-err" font-size="10" font-weight="700">RULE DRIFT</text>

  <rect class="s-card" x="34" y="98" width="434" height="58" rx="6" />
  <text x="46" y="116" class="s-mono c-sec" font-size="10.2">10:05 · Turn 3  User</text>
  <text x="46" y="133" class="s-sans c-pri" font-size="11.2">“Switch API auth from JWT to session cookies from now on”</text>
  <text x="46" y="149" class="s-sans c-mut" font-size="9.9">↳ CLAUDE.md &amp; old memory logs still retain “Use JWT”</text>

  <rect class="s-card" x="34" y="164" width="434" height="52" rx="6" />
  <text x="46" y="182" class="s-mono c-warn" font-size="10.2">11:40 · /compact Summary (or skipped MCP call)</text>
  <text x="46" y="199" class="s-sans c-sec" font-size="10.6">Early cookie decision drops out of summarized context</text>

  <rect class="s-term" x="34" y="224" width="434" height="74" rx="6" />
  <text x="46" y="242" class="s-mono c-sec" font-size="10.2">14:20 · Turn 42  Agent → write_file('auth.ts')</text>
  <rect x="46" y="250" width="410" height="22" rx="3" fill="rgba(248,113,113,0.13)" />
  <text x="54" y="265" class="s-mono c-err" font-size="10">+ import jwt from 'jsonwebtoken'  // stale rule reused</text>
  <text x="46" y="289" class="s-sans c-sec" font-size="10.2">Advisory only — written to disk and committed unchecked</text>

  <rect class="s-err" x="34" y="306" width="434" height="48" rx="6" />
  <text x="251" y="326" text-anchor="middle" class="s-sans c-err" font-size="11.4" font-weight="700">Result: Discovered only after wrong code is already written</text>
  <text x="251" y="343" text-anchor="middle" class="s-sans c-sec" font-size="10.2">Manual rollback + thousands of tokens wasted re-reading files</text>

  <circle cx="500" cy="214" r="14" fill="#141820" stroke="#2d3748" stroke-width="1.3" />
  <text x="500" y="218" text-anchor="middle" class="s-mono c-acc" font-size="10" font-weight="700">VS</text>

  <!-- RIGHT: WITH PRAXIS -->
  <rect class="s-panel" x="516" y="58" width="466" height="311" rx="8" />
  <text x="532" y="82" class="s-sans c-pri" font-size="12.2" font-weight="700">With praxis</text>
  <rect class="s-ok" x="850" y="66" width="118" height="22" rx="4" />
  <text x="909" y="81" text-anchor="middle" class="s-sans c-ok" font-size="10" font-weight="700">ENFORCED</text>

  <rect class="s-card" x="532" y="98" width="434" height="58" rx="6" />
  <text x="544" y="116" class="s-mono c-acc" font-size="10.2">10:05 · Write Gate (Atomic 1:N Overwrite)</text>
  <text x="544" y="133" class="s-mono c-mut" font-size="10.2" text-decoration="line-through">[#4] Use JWT</text>
  <text x="634" y="133" class="s-sans c-ok" font-size="10.8" font-weight="700">→  [#9] Session cookies only for API auth</text>
  <text x="544" y="149" class="s-sans c-mut" font-size="9.9">↳ Retires #4 immediately + broadcasts [REVOKED] across sessions</text>

  <rect class="s-info" x="532" y="164" width="434" height="52" rx="6" />
  <text x="544" y="182" class="s-mono c-acc" font-size="10.2">11:40 · /compact &amp; Checkpoint Auto-Recovery</text>
  <text x="544" y="199" class="s-sans c-pri" font-size="10.6">Restores [#9] &amp; core rules via <tspan class="c-ok" font-weight="700">[Post-Compact Restored]</tspan> automatically</text>

  <rect class="s-term" x="532" y="224" width="434" height="74" rx="6" />
  <text x="544" y="242" class="s-mono c-warn" font-size="10.1">14:20 · Turn 42  write_file('auth.ts') → Turn-End Stop Hook</text>
  <rect x="544" y="250" width="410" height="22" rx="3" fill="rgba(251,191,36,0.13)" />
  <text x="552" y="265" class="s-mono c-warn" font-size="10.2">[AUTO-FIX] Violates #9: No JWT — use session cookies</text>
  <text x="544" y="289" class="s-sans c-ok" font-size="10.2">↳ Agent self-corrects to sessionCookie before turn completes</text>

  <rect class="s-ok" x="532" y="306" width="434" height="48" rx="6" />
  <text x="749" y="326" text-anchor="middle" class="s-sans c-ok" font-size="11.2" font-weight="700">Result: Bad diffs self-corrected · unsafe shell commands blocked</text>
  <text x="749" y="343" text-anchor="middle" class="s-sans c-sec" font-size="10.1">Injects unsent deltas only (0 repeat evals) · zero manual upkeep</text>
</svg>
