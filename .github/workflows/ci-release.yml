name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Vet & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go Vet (Linux / macOS / Windows targets)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Go Vet (Native)
        if: matrix.os != 'ubuntu-latest'
        run: go vet ./...
      - name: Run Tests with Race Detector (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 ./...
      - name: Run Tests (Windows CGO-free)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

  release:
    name: Build & Publish GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile CGO-free Release Archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            STAGE="dist/stage-${GOOS}-${GOARCH}"
            mkdir -p "$STAGE"
            BIN_NAME="memorize"
            if [ "$GOOS" = "windows" ]; then BIN_NAME="memorize.exe"; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$STAGE/$BIN_NAME" ./cmd/memorize
            tar -C "$STAGE" -czf "dist/memorize-${GOOS}-${GOARCH}.tar.gz" "$BIN_NAME"
            if [ "$GOOS" = "windows" ]; then
              (cd "$STAGE" && zip -q "../memorize-${GOOS}-${GOARCH}.zip" "$BIN_NAME")
            fi
            rm -rf "$STAGE"
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "memorize ${GITHUB_REF_NAME}" \
            --generate-notes
