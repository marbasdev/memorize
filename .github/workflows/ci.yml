name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    name: Vet & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go Vet (Linux / macOS / Windows targets)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go vet ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Cross-compile Check (5 release targets)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -o "$RUNNER_TEMP/memorize-${GOOS}-${GOARCH}" ./cmd/memorize
          done
          rm -f "$RUNNER_TEMP"/memorize-*
      - name: Go Vet (Native)
        if: matrix.os != 'ubuntu-latest'
        run: go vet ./...
      - name: Run Tests with Race Detector (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 ./...
      - name: Run Tests (Windows CGO-free)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...
